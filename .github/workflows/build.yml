name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          D=app/src/main/java/com/abdulhameed/pubgflash
          mkdir -p $D app/src/main/res/drawable
          mv *.kt $D/
          mv AndroidManifest.xml app/src/main/
          mv ic_launcher.xml ic_stat.xml app/src/main/res/drawable/
          mv app-build.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
      - run: mv app/build/outputs/apk/debug/app-debug.apk PUBG-Flash.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PUBG Flash build ${{ github.run_number }}
          files: PUBG-Flash.apk
